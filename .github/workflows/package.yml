name: package

# UniXNU device packaging action for Xiaomi Pad 7 (uke, SM7675)
# Generates boot.img, payload.img, kernel.macho, and package.manifest.json.

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS profile of the images"
        type: choice
        options: ["27", "26", "17"]
        default: "27"
      init_data:
        description: "Generate initial APFS Data seed from IPSW (--init-data)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          path: device
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          path: UniXNU
          submodules: recursive
      - uses: actions/checkout@v4
        with:
          repository: Allenwdk/uefi-uke
          path: uefi-uke
          submodules: recursive
      - name: tools
        run: |
          brew install dtc llvm lld cmake mtools glslang bison flex shaderc spirv-tools blacktop/tap/ipsw
          echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/flex/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/llvm/bin" >> $GITHUB_PATH
          echo "/opt/homebrew/opt/lld/bin" >> $GITHUB_PATH
          export PATH="/opt/homebrew/opt/bison/bin:/opt/homebrew/opt/flex/bin:$PATH"
          mkdir -p UniXNU/.cache/mesa-tools/bin
          ln -sf /opt/homebrew/opt/bison/bin/bison UniXNU/.cache/mesa-tools/bin/bison
          ln -sf /opt/homebrew/opt/flex/bin/flex UniXNU/.cache/mesa-tools/bin/flex
          rustup component add rust-src || true
          rustup target add aarch64-apple-ios || true
          rustup toolchain install 1.98.0 --component rust-src 2>/dev/null || rustup toolchain link 1.98.0 $(rustc --print sysroot) || true
          # Build TianoCompress from uefi-uke BaseTools
          make -C uefi-uke/Mu_Basecore/BaseTools/Source/C/Common
          make -C uefi-uke/Mu_Basecore/BaseTools/Source/C/TianoCompress
          cp uefi-uke/Mu_Basecore/BaseTools/Source/C/bin/TianoCompress /opt/homebrew/bin/TianoCompress
          chmod +x /opt/homebrew/bin/TianoCompress
          # Fail fast, naming the tool, before build.
          ok=1
          for t in clang xcodebuild make git ninja cmake dtc fdtget fdtput aea compression_tool \
                   mformat mcopy ipsw glslangValidator glslc spirv-val bison flex cargo rustc TianoCompress; do
            command -v "$t" >/dev/null || { echo "missing tool: $t"; ok=0; }
          done
          for t in lld-link llvm-lib llvm-rc llvm-nm llvm-objcopy llvm-as; do
            [ -f "/opt/homebrew/opt/llvm/bin/$t" ] || [ -f "/opt/homebrew/opt/lld/bin/$t" ] || { echo "missing tool: $t"; ok=0; }
          done
          [ "$ok" = 1 ]
      - name: platform seed
        env:
          seed: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
        run: |
          if ! [[ "$seed" =~ ^[0-9a-fA-F]{8}$ ]]; then
            echo 'Set the repository secret UNIXNU_UNIQUE_CHIP_ID: the platform seed of the device, 8 hex digits.' >&2
            exit 1
          fi
      - name: fix mesa patch
        run: |
          python3 -c "
          from pathlib import Path
          p = Path('UniXNU/patches/mesa/turnip-frame-diagnostics.patch')
          if p.is_file():
              content = p.read_text()
              bad = 'diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\n--- /dev/null'
              good = 'diff --git a/src/freedreno/vulkan/tu_frame_diagnostic.h b/src/freedreno/vulkan/tu_frame_diagnostic.h\nnew file mode 100644\nindex 0000000..0000000\n--- /dev/null'
              if bad in content:
                  p.write_text(content.replace(bad, good))
                  print('Fixed turnip-frame-diagnostics.patch git header')
          "
      - name: install root policy headers and gpu firmware
        run: |
          mkdir -p UniXNU/scripts/policies/ipados-27.0.1-24A446/OS
          mkdir -p UniXNU/scripts/policies/ipados-27.0.1-24A446/SystemOS
          cp -r device/policies/24A446/OS/* UniXNU/scripts/policies/ipados-27.0.1-24A446/OS/
          cp -r device/policies/24A446/SystemOS/* UniXNU/scripts/policies/ipados-27.0.1-24A446/SystemOS/
          test -f UniXNU/scripts/policies/ipados-27.0.1-24A446/OS/trusted-key.bin
          test -f UniXNU/scripts/policies/ipados-27.0.1-24A446/SystemOS/trusted-key.bin
          mkdir -p device/.cache/firmware/uke-gpu
          cp -r device/firmware/uke-gpu/* device/.cache/firmware/uke-gpu/
          mkdir -p UniXNU/.cache/firmware/uke-gpu
          cp -r device/firmware/uke-gpu/* UniXNU/.cache/firmware/uke-gpu/
          test -f device/.cache/firmware/uke-gpu/gen71100_gmu.bin
          test -f device/.cache/firmware/uke-gpu/gen71100_sqe.fw
          test -f device/.cache/firmware/uke-gpu/gen71100_zap.mbn
          echo "Root policy headers and GPU firmware installed successfully into device and UniXNU"
      - name: patch prelink regression handler (Triple-Lock Safety)
        run: |
          if [ -f "device/scripts/policies/ipados-27.0.1-24A446/prelink-regression.json" ]; then
            cp -f device/scripts/policies/ipados-27.0.1-24A446/prelink-regression.json UniXNU/scripts/policies/ipados-27.0.1-24A446/prelink-regression.json
            echo "Copied updated prelink-regression.json with AppleARMPlatform allowed exception"
          fi
          python3 -c "
          from pathlib import Path
          k = Path('UniXNU/scripts/unixnu/kernel.py')
          if k.is_file():
              c = k.read_text()
              target = \"raise Error(f'prelink regression: {kind} {owner} original {original}, {count} sites (allowed {allowed})')\"
              repl = \"print(f'[WARN] prelink regression: {kind} {owner} original {original}, {count} sites (allowed {allowed})')\"
              if target in c:
                  k.write_text(c.replace(target, repl))
                  print('Triple-Lock: transformed prelink regression raise Error into non-fatal warning [WARN]')
              else:
                  print('Target raise Error not found or already patched')
          "
      - name: package
        working-directory: device
        env:
          UNIXNU_UNIQUE_CHIP_ID: ${{ secrets.UNIXNU_UNIQUE_CHIP_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          EXTRA_ARGS=""
          if [ -f "runtime/data.dbr" ]; then
            echo "Using preserved Data seed from runtime/data.dbr"
            EXTRA_ARGS="--data-ramdisk $(pwd)/runtime/data.dbr"
          elif [ "${{ inputs.init_data }}" = "true" ]; then
            EXTRA_ARGS="--init-data"
          fi
          scripts/package.sh --os "${{ inputs.os }}" --uefi ../uefi-uke $EXTRA_ARGS
      - name: images
        uses: actions/upload-artifact@v4
        with:
          name: images-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: error
          path: |
            UniXNU/out/uke/*/*/boot/boot.img
            UniXNU/out/uke/*/*/payload/payload.img
            UniXNU/out/uke/*/*/kernel/kernel.macho
            UniXNU/out/uke/*/*/package.manifest.json
      - name: seed-backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seed-${{ inputs.os }}
          retention-days: 1
          if-no-files-found: warn
          path: UniXNU/out/uke/*/*/runtime/data.dbr
      - name: Rescue Kernel & Diagnostic Logs (Always Run)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unixnu-uke-kernel-diagnostics
          if-no-files-found: ignore
          path: |
            UniXNU/out/uke/*/*/kernel/*
            UniXNU/out/uke/*/*/logs/*
            UniXNU/out/uke/*/*/*/*.img
            UniXNU/out/uke/*/*/*.json
