name: grow-uke-data-seed

on:
  workflow_dispatch:
    inputs:
      gib:
        description: 'APFS container size in GiB; it must fit the current userdata with the root image, log reserve and store bitmap'
        required: true
        default: '80'

permissions:
  contents: read
  actions: read

jobs:
  grow:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out the device repository
        uses: actions/checkout@v4
        with:
          path: UniXNU-uke

      - name: Check out UniXNU
        uses: actions/checkout@v4
        with:
          repository: Allenwdk/UniXNU
          ref: uke
          path: UniXNU
          submodules: recursive

      - name: Prepare seed fixture
        run: |
          mkdir -p UniXNU/build/owner-data-fixture
          cp UniXNU-uke/data/owner-data-32.dbr UniXNU/build/owner-data-fixture/owner-data-32.dbr
          cp UniXNU-uke/data/seed.json UniXNU/build/owner-data-fixture/seed.json
          ls -lh UniXNU/build/owner-data-fixture

      - name: Patch grow script
        run: |
          python3 UniXNU-uke/scripts/patch-seed-data-grow.py UniXNU/scripts/seed-data-grow.py

      - name: Grow the seed
        working-directory: UniXNU
        run: |
          GIB="${{ github.event.inputs.gib }}"
          python3 scripts/seed-data-grow.py --gib "$GIB" \
            build/owner-data-fixture/owner-data-32.dbr \
            build/owner-data-fixture/owner-data-$GIB.dbr \
            | tee build/owner-data-fixture/grown.json
          ls -lh build/owner-data-fixture

      - name: Upload the grown seed
        uses: actions/upload-artifact@v4
        with:
          name: uke-data-seed-${{ github.event.inputs.gib }}
          path: |
            UniXNU/build/owner-data-fixture/owner-data-${{ github.event.inputs.gib }}.dbr
            UniXNU/build/owner-data-fixture/grown.json
            UniXNU/build/owner-data-fixture/seed.json
          if-no-files-found: error
          retention-days: 14
