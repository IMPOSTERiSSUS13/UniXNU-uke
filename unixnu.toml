[boot]
boot_args = "-v serial=3 debug=0x14e keepsyms=1 panic_wait_forever=1 wdt=-1"
timeout = 1
default = "unixnu"

[ui]
title = "UniXNU iPadOS 27"

[[entry]]
id = "unixnu"
title = "iPadOS 27.0.1 (24A446)"
type = "macho"
